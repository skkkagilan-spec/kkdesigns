<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD7B7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#BAA170" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7C673A" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <g stroke="url(#mandalaGold)" stroke-width="1.2" fill="none" opacity="0.75">
    <!-- Outer Bhupura (Stepped Sacred Gate) -->
    <rect x="50" y="50" width="400" height="400" />
    <rect x="65" y="65" width="370" height="370" />
    <path d="M 220 50 L 220 30 L 280 30 L 280 50" />
    <path d="M 220 450 L 220 470 L 280 470 L 280 450" />
    <path d="M 50 220 L 30 220 L 30 280 L 50 280" />
    <path d="M 450 220 L 470 220 L 470 280 L 450 280" />

    <!-- Concentric Circles -->
    <circle cx="250" cy="250" r="170" />
    <circle cx="250" cy="250" r="158" />
    <circle cx="250" cy="250" r="130" />
    <circle cx="250" cy="250" r="120" />
    <circle cx="250" cy="250" r="100" />
    <circle cx="250" cy="250" r="60" />
    <circle cx="250" cy="250" r="25" />
    <circle cx="250" cy="250" r="5" fill="url(#mandalaGold)" />

    <!-- 16 Outer Lotus Petals -->
    <g>
      <!-- Petal 0 deg -->
      <path d="M 250 80 C 235 100, 235 125, 250 130 C 265 125, 265 100, 250 80 Z" />
      <path d="M 250 420 C 235 400, 235 375, 250 370 C 265 375, 265 400, 250 420 Z" />
      <path d="M 80 250 C 100 235, 125 235, 130 250 C 125 265, 100 265, 80 250 Z" />
      <path d="M 420 250 C 400 235, 375 235, 370 250 C 375 265, 400 265, 420 250 Z" />
      <!-- Diagonals -->
      <path d="M 130 130 C 150 145, 165 160, 160 170 C 150 165, 135 150, 130 130 Z" />
      <path d="M 370 130 C 350 145, 335 160, 340 170 C 350 165, 365 150, 370 130 Z" />
      <path d="M 130 370 C 150 355, 165 340, 160 330 C 150 335, 135 350, 130 370 Z" />
      <path d="M 370 370 C 350 355, 335 340, 340 330 C 350 335, 365 350, 370 370 Z" />
    </g>

    <!-- Interlocking Sri Yantra Triangles -->
    <!-- Upward Triangles -->
    <polygon points="250,135 165,295 335,295" />
    <polygon points="250,165 180,315 320,315" />
    <polygon points="250,195 200,325 300,325" />
    <polygon points="250,215 220,335 280,335" />

    <!-- Downward Triangles -->
    <polygon points="250,365 165,205 335,205" />
    <polygon points="250,335 180,185 320,185" />
    <polygon points="250,305 200,175 300,175" />
    <polygon points="250,285 220,165 280,165" />
    <polygon points="250,270 230,190 270,190" />
  </g>
</svg>
