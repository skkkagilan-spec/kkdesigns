<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C789" />
      <stop offset="50%" stop-color="#BAA170" />
      <stop offset="100%" stop-color="#8F7243" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5A6" />
      <stop offset="100%" stop-color="#9E804D" />
    </linearGradient>
  </defs>

  <!-- Stylized KK Monogram -->
  <g class="brand-monogram">
    <!-- First K - Primary Serif Stem & Arms -->
    <path d="M 35 22 L 68 22 L 68 30 L 56 30 L 56 108 L 68 108 L 68 116 L 35 116 L 35 108 L 47 108 L 47 30 L 35 30 Z" fill="currentColor" />
    
    <!-- First K Upper Diagonal -->
    <path d="M 52 74 L 88 32 L 78 24 L 112 24 L 112 32 L 100 32 L 68 70 L 105 112 C 103 115, 96 116, 90 116 C 75 116, 60 92, 52 82 Z" fill="currentColor" />
    
    <!-- First K Curved Flourish Tail -->
    <path d="M 68 70 C 80 84, 98 104, 126 116 C 104 116, 82 104, 66 84 Z" fill="url(#goldGrad)" />
    
    <!-- Second K Offset Ligature Flourish -->
    <path d="M 78 72 C 92 88, 114 110, 148 122 C 122 121, 98 108, 78 84 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 82 44 L 114 22 L 126 22 L 95 58 Z" fill="currentColor" opacity="0.9" />
  </g>

  <!-- Elegant Vertical Divider Line -->
  <line x1="168" y1="20" x2="168" y2="118" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round" />

  <!-- Typography: Keerthika / Interior Designer -->
  <g class="brand-text">
    <text x="188" y="66" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="44" font-weight="600" letter-spacing="1.5" fill="currentColor">Keerthika</text>
    <text x="190" y="98" font-family="'Montserrat', 'Outfit', sans-serif" font-size="15" font-weight="400" letter-spacing="4.5" fill="url(#goldGrad)">INTERIOR DESIGNER</text>
  </g>
</svg>
