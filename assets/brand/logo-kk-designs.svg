<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" fill="none">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B5" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8F7243" />
    </linearGradient>
  </defs>

  <!-- Stylized KK Monogram -->
  <g transform="translate(10, 5)">
    <!-- First K Stem -->
    <path d="M 20 22 L 48 22 L 48 28 L 38 28 L 38 92 L 48 92 L 48 98 L 20 98 L 20 92 L 30 92 L 30 28 L 20 28 Z" fill="currentColor" />
    <!-- Diagonal Arm -->
    <path d="M 36 62 L 64 26 L 56 22 L 84 22 L 84 28 L 74 28 L 50 58 Z" fill="currentColor" />
    <!-- Flourish Leg 1 -->
    <path d="M 48 58 C 58 70, 72 88, 96 98 C 76 98, 58 88, 46 70 Z" fill="url(#goldGrad2)" />
    <!-- Flourish Leg 2 (Offset echo) -->
    <path d="M 58 60 C 70 74, 88 92, 116 102 C 94 102, 74 90, 58 70 Z" fill="url(#goldGrad2)" opacity="0.8" />
  </g>

  <!-- "Designs" Serif Text -->
  <text x="135" y="76" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="48" font-weight="500" letter-spacing="1" fill="currentColor">Designs</text>
  
  <!-- Underline accent -->
  <line x1="135" y1="88" x2="280" y2="88" stroke="url(#goldGrad2)" stroke-width="1.5" stroke-linecap="round" />
</svg>
